[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iso3166-registry"
version = "1.5.2"
description = "A canonical, versioned, machine-readable registry of ISO 3166 country codes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Le P'tit", email = "slimissabara@gmail.com" }]
keywords = ["iso3166", "countries", "registry", "quantos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
iso3166 = "iso3166.cli:main"

[project.urls]
Homepage = "https://github.com/slimissa/iso3166"
Repository = "https://github.com/slimissa/iso3166"

[tool.setuptools]
packages = ["iso3166"]

[tool.setuptools.package-data]
iso3166 = ["iso3166.json"]
